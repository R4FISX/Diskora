plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.diskora'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'com.github.oshi:oshi-core:6.11.0'
}

application {
    mainClass = 'com.diskora.Launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8'
    if (providers.gradleProperty('javafxCacheDir').isPresent()) {
        systemProperty 'javafx.cachedir', providers.gradleProperty('javafxCacheDir').get()
    }
    if (providers.gradleProperty('javaTempDir').isPresent()) {
        systemProperty 'java.io.tmpdir', providers.gradleProperty('javaTempDir').get()
    }
}
